name: Release App

# Builds every platform from the private sources and publishes the release here:
#   desktop (Windows / macOS / Linux) — legiz-ru/pxd-src; px pulls the private
#     Go module legiz-ru/prizrak-go-kit;
#   Android — legiz-ru/pxa-src with prizrak-go-kit as its go-kit/ submodule.
# Secrets: PRIVATE_SRC_TOKEN (fine-grained PAT, Contents: read on pxd-src,
# pxa-src and prizrak-go-kit); KEYSTORE_BASE64, SIGNING_* (Android);
# MACOS_* / APPLE_ID / APP_SPECIFIC_PASSWORD / TEAM_ID (optional macOS signing);
# AUR_* (AUR).
# This repository is public: the Go module cache stays off (it would hold
# prizrak-go-kit's sources) and no workflow here runs on pull_request.

run-name: Release App ${{ inputs.version || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.21)'
        type: string
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      release_notes_b64:
        description: 'Release notes: Markdown encoded as base64. If set, the release is created only after a successful build, already with all files and download links (nothing is published up front). Leave empty for the old flow (empty release created immediately).'
        type: string
        required: false
        default: ''
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        type: boolean
        default: true
      pxd_ref:
        description: 'pxd-src (desktop) branch, tag or commit'
        type: string
        default: 'main'
      pxa_ref:
        description: 'pxa-src (Android) branch, tag or commit'
        type: string
        default: 'main'
      dry_run:
        description: 'Build only: no tag, no release, no AUR, no update feed (artifacts stay on the run)'
        type: boolean
        default: false

jobs:
  # ── Setup: determine version, create tag + release on workflow_dispatch ──
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      pxd_sha: ${{ steps.src.outputs.pxd_sha }}
      pxa_sha: ${{ steps.src.outputs.pxa_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # One commit of each private repository for every job of the run (a
      # branch could move between the matrix jobs).
      - name: Source commits (pxd-src, pxa-src)
        id: src
        env:
          TOKEN: ${{ secrets.PRIVATE_SRC_TOKEN }}
          PXD_REF: ${{ inputs.pxd_ref || 'main' }}
          PXA_REF: ${{ inputs.pxa_ref || 'main' }}
        run: |
          set -euo pipefail
          # Outside the checkout: the GITHUB_TOKEN header it persists in .git/config
          # would be sent instead of this token.
          cd "$RUNNER_TEMP"
          [ -n "$TOKEN" ] || { echo "::error::The PRIVATE_SRC_TOKEN secret is not set"; exit 1; }
          resolve() {
            if [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then echo "$2"; return; fi
            local refs sha
            refs=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/legiz-ru/$1.git") || { echo "::error::cannot read legiz-ru/$1 (PRIVATE_SRC_TOKEN)" >&2; exit 1; }
            sha=$(printf '%s\n' "$refs" | awk -v h="refs/heads/$2" -v t="refs/tags/$2" -v d="refs/tags/$2^{}" '$2==h||$2==d{print $1; exit} $2==t{x=$1} END{if(x)print x}' | head -n1)
            [ -n "$sha" ] || { echo "::error::legiz-ru/$1 has no branch or tag '$2'" >&2; exit 1; }
            echo "$sha"
          }
          pxd=$(resolve pxd-src "$PXD_REF")
          pxa=$(resolve pxa-src "$PXA_REF")
          echo "pxd_sha=$pxd" >> "$GITHUB_OUTPUT"
          echo "pxa_sha=$pxa" >> "$GITHUB_OUTPUT"
          {
            echo '### Sources'
            echo "- pxd-src \`$PXD_REF\` → \`$pxd\`"
            echo "- pxa-src \`$PXA_REF\` → \`$pxa\`"
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo '- **dry run**: no tag, release, AUR or update feed'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # With release notes supplied, the release is created by the `release` job
      # after every build has succeeded, so a broken payload must fail here, before
      # an hour of builds, not at the very end.
      - name: Validate release notes (workflow_dispatch with notes)
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes_b64 != '' && inputs.dry_run != true
        env:
          NOTES_B64: ${{ inputs.release_notes_b64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s' "$NOTES_B64" | tr -d ' \r\n\t' | base64 -d > notes.md 2>/dev/null; then
            echo "::error::release_notes_b64 is not valid base64"
            exit 1
          fi
          if [ ! -s notes.md ]; then
            echo "::error::release_notes_b64 decodes to empty text"
            exit 1
          fi
          if ! iconv -f UTF-8 -t UTF-8 notes.md > /dev/null 2>&1; then
            echo "::error::release_notes_b64 does not decode to UTF-8 text"
            exit 1
          fi
          {
            echo '### Release notes (decoded)'
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "${{ inputs.version }}" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "::error::Release ${{ inputs.version }} is already published; run without release_notes_b64 to rebuild it, or pick a new version"
            exit 1
          fi
        shell: bash

      - name: Create tag and GitHub release (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes_b64 == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create tag if it doesn't exist yet
          git tag "$VERSION" || true
          git push origin "$VERSION" || true
          # Create release (ignore error if already exists)
          gh release create "$VERSION" \
            --title "$VERSION" \
            ${{ inputs.prerelease == true && '--prerelease' || '' }} \
            --notes "" || true

  # ── Android (legiz-ru/pxa-src) ──
  build_android:
    needs: [setup]
    if: github.event_name == 'release' || inputs.build_android == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - name: Checkout pxa-src with go-kit
        uses: actions/checkout@v4
        with:
          repository: legiz-ru/pxa-src
          ref: ${{ needs.setup.outputs.pxa_sha }}
          token: ${{ secrets.PRIVATE_SRC_TOKEN }}
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v6
        with:
          go-version-file: go-kit/go.mod
          cache: false

      # no Gradle cache either: its build cache holds the app's compiled code
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: gomobile, at go-kit's x/mobile
        working-directory: go-kit
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "keystore.password=$SIGNING_STORE_PASSWORD"
            echo "key.alias=$SIGNING_KEY_ALIAS"
            echo "key.password=$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Build APKs
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Rename APKs
        run: |
          set -e
          for apk in app/build/outputs/apk/meta/release/prizrak-box-*-meta-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^prizrak-box-.*-meta-(.+)-release\.apk$/\1/')
            cp "$apk" "prizrak-box-android-$abi.apk"
          done
          ls -l prizrak-box-android-*.apk
          [ -s prizrak-box-android-universal.apk ] || { echo "No universal APK"; exit 1; }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: prizrak-box-android-*.apk

      - name: Cancel workflow on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ── AUR ──
  # prizrak-box-bin repackages the Arch package nfpm builds in build_linux
  # (linux-<arch>-aur.tar.zst, a pacman package): same files, dependencies and
  # install hooks (TUN service registration) as the release asset.
  publish_aur:
    name: Publish to AUR
    # After `release`: the PKGBUILD points at the release's assets, which only
    # exist once that job has uploaded them (and, for a run with release notes,
    # once the release itself has been published).
    needs: [setup, build_linux, release]
    # Run only if Linux was built (or not skipped) and succeeded
    if: |
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.build_linux.result == 'success' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: aur
    # AUR is a secondary distribution channel served by a third party that is
    # regularly taken down for maintenance (a failed `git clone` from
    # aur.archlinux.org exits 128). Publishing there must never hold up the
    # release of the Windows/macOS/Linux/Android binaries, so this job is
    # non-fatal: it reports the failure and the release job ignores its result.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts

      - name: Read the Arch packages (checksums, dependencies, install hooks)
        id: pkg
        run: |
          set -euo pipefail
          amd64_pkg="artifacts/linux-amd64/linux-amd64-aur.tar.zst"
          arm64_pkg="artifacts/linux-arm64/linux-arm64-aur.tar.zst"
          for f in "$amd64_pkg" "$arm64_pkg"; do
            [ -s "$f" ] || { echo "Missing $f"; exit 1; }
          done
          echo "amd64_sha256=$(sha256sum "$amd64_pkg" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
          echo "arm64_sha256=$(sha256sum "$arm64_pkg" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
          # nfpm writes the dependency list into .PKGINFO and the package's
          # postinstall / preremove scripts as pacman hooks into .INSTALL.
          tar --zstd -xOf "$amd64_pkg" .PKGINFO | sed -n 's/^depend = //p' > depends.txt
          tar --zstd -xOf "$amd64_pkg" .INSTALL > prizrak-box.install
          if [ ! -s depends.txt ] || [ ! -s prizrak-box.install ]; then
            echo "No dependencies or install hooks in $amd64_pkg"; exit 1
          fi

      - name: Generate AUR files (PKGBUILD, .SRCINFO, prizrak-box.install)
        run: |
          set -euo pipefail
          TAG="${{ needs.setup.outputs.version }}"
          PKGVER_RAW="${TAG#v}"
          PKGVER="${PKGVER_RAW//-/_}"
          PKGNAME=prizrak-box-bin
          PKGNAME_BASE="${PKGNAME%-bin}"
          PKGREL=1
          PKGDESC="A Simple Mihomo GUI (prebuilt Rust + Slint build)"
          LICENSE="GPL-3.0-only"
          URL="https://github.com/legiz-ru/Prizrak-Box"
          SRC_AARCH64="${PKGNAME_BASE}-${PKGVER}-aarch64.tar.zst::${URL}/releases/download/${TAG}/linux-arm64-aur.tar.zst"
          SRC_X86_64="${PKGNAME_BASE}-${PKGVER}-x86_64.tar.zst::${URL}/releases/download/${TAG}/linux-amd64-aur.tar.zst"
          SUM_AARCH64="${{ steps.pkg.outputs.arm64_sha256 }}"
          SUM_X86_64="${{ steps.pkg.outputs.amd64_sha256 }}"
          DEPENDS="$(sed "s/.*/'&'/" depends.txt | paste -sd' ' -)"

          cat > PKGBUILD <<EOF
          pkgname=${PKGNAME}
          pkgver=${PKGVER}
          pkgrel=${PKGREL}
          pkgdesc="${PKGDESC}"
          arch=('aarch64' 'x86_64')
          url="${URL}"
          license=('${LICENSE}')
          provides=('${PKGNAME_BASE}')
          conflicts=('${PKGNAME_BASE}')
          depends=(${DEPENDS})
          options=('!strip' '!debug')
          install=${PKGNAME_BASE}.install
          source_aarch64=("${SRC_AARCH64}")
          source_x86_64=("${SRC_X86_64}")
          sha256sums_aarch64=('${SUM_AARCH64}')
          sha256sums_x86_64=('${SUM_X86_64}')

          # The source is the release's pacman package: makepkg unpacks it into
          # \$srcdir, and its usr/ tree is the whole package.
          package() {
            cp -a "\${srcdir}/usr" "\${pkgdir}/"
          }
          EOF

          {
            echo "pkgbase = ${PKGNAME}"
            printf '\tpkgdesc = %s\n' "${PKGDESC}"
            printf '\tpkgver = %s\n' "${PKGVER}"
            printf '\tpkgrel = %s\n' "${PKGREL}"
            printf '\turl = %s\n' "${URL}"
            printf '\tinstall = %s\n' "${PKGNAME_BASE}.install"
            printf '\tarch = aarch64\n\tarch = x86_64\n'
            printf '\tlicense = %s\n' "${LICENSE}"
            while read -r dep; do printf '\tdepends = %s\n' "$dep"; done < depends.txt
            printf '\tprovides = %s\n\tconflicts = %s\n' "${PKGNAME_BASE}" "${PKGNAME_BASE}"
            printf '\toptions = !strip\n\toptions = !debug\n'
            printf '\tsource_aarch64 = %s\n\tsha256sums_aarch64 = %s\n' "${SRC_AARCH64}" "${SUM_AARCH64}"
            printf '\tsource_x86_64 = %s\n\tsha256sums_x86_64 = %s\n' "${SRC_X86_64}" "${SUM_X86_64}"
            echo
            echo "pkgname = ${PKGNAME}"
          } > .SRCINFO
          cat PKGBUILD .SRCINFO prizrak-box.install

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Publish to AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/prizrak-box-bin.git aur-repo
          cp PKGBUILD .SRCINFO prizrak-box.install aur-repo/
          cd aur-repo
          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_COMMIT_EMAIL }}"
          # The Electron package's launcher script is no longer part of it.
          git rm -q --ignore-unmatch prizrak-box.sh
          git add PKGBUILD .SRCINFO prizrak-box.install
          git diff --cached --quiet || git commit -m "Update to version ${{ needs.setup.outputs.version }}"
          git push --force origin master

      # NOTE: deliberately no "Cancel workflow on failure" step here (unlike the
      # build jobs). Cancelling the run over an AUR outage killed every other
      # platform mid-build. Record the failure instead and let the release go out.
      - name: Report skipped AUR publish
        if: ${{ failure() }}
        run: |
          echo "::warning title=AUR publish skipped::Could not publish to the AUR (see the step log above; the AUR is frequently down for maintenance). The release itself is unaffected — re-run this job once aur.archlinux.org is reachable."
          {
            echo "### ⚠️ AUR publish skipped"
            echo
            echo "Publishing \`prizrak-box-bin\` to the AUR failed for version \`${{ needs.setup.outputs.version }}\`."
            echo "This does **not** affect the release: all other artifacts are published as usual."
            echo
            echo "Re-run just this job once [aur.archlinux.org](https://status.archlinux.org) is reachable again."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── macOS — .app (signed + notarized when the secrets are present), .zip + .dmg ──
  build_macos:
    needs: [setup]
    if: github.event_name == 'release' || inputs.build_macos == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Checkout pxd-src
        uses: actions/checkout@v4
        with:
          repository: legiz-ru/pxd-src
          ref: ${{ needs.setup.outputs.pxd_sha }}
          token: ${{ secrets.PRIVATE_SRC_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-go@v6
        with: { go-version: '1.26', check-latest: true, cache: false }
      - name: Private Go module (prizrak-go-kit)
        shell: bash
        env: { PRIVATE_SRC_TOKEN: '${{ secrets.PRIVATE_SRC_TOKEN }}' }
        run: |
          echo "GOPRIVATE=github.com/legiz-ru/prizrak-go-kit" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${PRIVATE_SRC_TOKEN}@github.com/legiz-ru/prizrak-go-kit".insteadOf "https://github.com/legiz-ru/prizrak-go-kit"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-rs -> target', key: '${{ matrix.target }}' }
      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV
      - name: Sync VERSION to package.json
        run: node build/sync-version.js
      - name: Refresh geo/model data
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o src-go/internal/em/Model.bin        https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin
          curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o src-go/internal/em/geoip.metadb      https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
          curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o src-go/internal/em/GeoSite.dat        https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o src-go/internal/em/BundleMRS.7z        https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/BundleMRS.7z
          curl -fsSL --retry 3 --retry-delay 5 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o src-go/internal/em/GeoLite2-ASN.mmdb  https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
      - name: Build px + px-service
        env: { GOARCH: '${{ matrix.arch }}' }
        run: |
          (cd src-go && go mod download github.com/legiz-ru/prizrak-go-kit)
          src-go/kit_core_check.sh
          (cd src-go && go run github.com/legiz-ru/prizrak-go-kit/prizrakkit/cmd/templates internal/tmpl/builtin)
          (cd src-go && CGO_ENABLED=0 go build -tags=with_gvisor -trimpath -ldflags="-s -w -X github.com/legiz-ru/prizrak-box/api.Version=${{ env.VERSION }}" -o px .)
          (cd src-service && CGO_ENABLED=0 go build -ldflags="-s -w" -o px-service .)
      - name: Build Rust + Slint app
        run: |
          cd src-rs
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Regenerate icons (gen-icons.mjs)
        run: |
          npm install --no-audit --no-fund
          node build/gen-icons.mjs
      - name: Assemble .app
        run: src-rs/packaging/macos/build-app.sh "src-rs/target/${{ matrix.target }}/release/prizrak-box" "$VERSION"
      - name: Sign (if certificate secrets are present)
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "No MACOS_CERTIFICATE secret — producing an UNSIGNED (ad-hoc) build."
            exit 0
          fi
          KEYCHAIN="ci-signing.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN"
          CERT_PATH="$(mktemp /tmp/cert-XXXXXXXX.p12)"
          security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH" 2>/dev/null || echo "$MACOS_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -A
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | sed -E 's/^.*"(.+)"$/\1/')
          APP="Prizrak-Box.app"
          ENT="$RUNNER_TEMP/entitlements.mac.plist"
          tr -d '\r' < build/entitlements.mac.plist > "$ENT"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP/Contents/MacOS/px" "$APP/Contents/MacOS/px-service"
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Notarize (if Apple ID secrets are present)
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "Notarization secrets not all present — skipping notarization."
            exit 0
          fi
          ditto -c -k --keepParent "Prizrak-Box.app" "notarize.zip"
          xcrun notarytool submit "notarize.zip" --apple-id "$APPLE_ID" --password "$APP_SPECIFIC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "Prizrak-Box.app"
      - name: Package .zip + .dmg
        run: |
          set -euo pipefail
          zip -qr "macos-${{ matrix.arch }}.zip" "Prizrak-Box.app"
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then export PB_UNSIGNED=1; fi
          node src-rs/packaging/macos/create-macos-dmg.mjs ${{ matrix.arch }} macos-${{ matrix.arch }}.dmg
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$HOME/Library/Keychains/ci-signing.keychain-db" | head -n 1 | sed -E 's/^.*"(.+)"$/\1/')
            codesign --force --timestamp --sign "$IDENTITY" "macos-${{ matrix.arch }}.dmg" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            macos-${{ matrix.arch }}.zip
            macos-${{ matrix.arch }}.dmg
      - name: Cancel workflow on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ── Windows — WiX MSI (installer/) + portable zip ──
  build_windows:
    needs: [setup]
    if: github.event_name == 'release' || inputs.build_windows == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            msiarch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            msiarch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - name: Checkout pxd-src
        uses: actions/checkout@v4
        with:
          repository: legiz-ru/pxd-src
          ref: ${{ needs.setup.outputs.pxd_sha }}
          token: ${{ secrets.PRIVATE_SRC_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-go@v6
        with: { go-version: '1.26', check-latest: true, cache: false }
      - name: Private Go module (prizrak-go-kit)
        shell: bash
        env: { PRIVATE_SRC_TOKEN: '${{ secrets.PRIVATE_SRC_TOKEN }}' }
        run: |
          echo "GOPRIVATE=github.com/legiz-ru/prizrak-go-kit" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${PRIVATE_SRC_TOKEN}@github.com/legiz-ru/prizrak-go-kit".insteadOf "https://github.com/legiz-ru/prizrak-go-kit"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-rs -> target', key: '${{ matrix.target }}' }
      - name: Set Version
        shell: bash
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV
      - name: Sync VERSION to package.json
        run: node build/sync-version.js
      - name: Refresh geo/model data
        shell: pwsh
        run: |
          function Fetch($uri, $out) {
            $headers = @{ Authorization = "token ${{ secrets.GITHUB_TOKEN }}" }
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $out; return }
              catch { if ($i -eq 4) { throw }; Write-Host "Attempt $i failed, retrying in 5s..."; Start-Sleep 5 }
            }
          }
          Fetch "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin" "src-go/internal/em/Model.bin"
          Fetch "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" "src-go/internal/em/geoip.metadb"
          Fetch "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" "src-go/internal/em/GeoSite.dat"
          Fetch "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/BundleMRS.7z" "src-go/internal/em/BundleMRS.7z"
          Fetch "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb" "src-go/internal/em/GeoLite2-ASN.mmdb"
      - name: Build px + px-service
        shell: pwsh
        env: { GOARCH: '${{ matrix.arch }}' }
        run: |
          cd src-go;       go run github.com/legiz-ru/prizrak-go-kit/prizrakkit/cmd/templates internal/tmpl/builtin; cd ..
          # icon + VERSIONINFO: Task Manager shows these names, not a bare px.exe
          go run build/winres.go -ico build/appicon.ico -arch $env:GOARCH -desc "Prizrak-Box Backend Core" -file px.exe -version $env:VERSION.TrimStart('v') -out "src-go/rsrc_windows_$env:GOARCH.syso"
          go run build/winres.go -ico build/appicon.ico -arch $env:GOARCH -desc "Prizrak-Box Service" -file px-service.exe -version $env:VERSION.TrimStart('v') -out "src-service/rsrc_windows_$env:GOARCH.syso"
          cd src-go;       $env:CGO_ENABLED='0'; go build -tags=with_gvisor -trimpath -ldflags="-s -w -X github.com/legiz-ru/prizrak-box/api.Version=$env:VERSION" -o px.exe .; cd ..
          cd src-service;  $env:CGO_ENABLED='0'; go build -ldflags="-s -w" -o px-service.exe .;   cd ..
      - name: Build Rust + Slint app (Prizrak-Box.exe with icon + version)
        shell: pwsh
        run: |
          cd src-rs
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage app (layout installer/build-msi.js harvests)
        shell: pwsh
        run: |
          $dir = "out/Prizrak-Box-win32-${{ matrix.msiarch }}"
          New-Item -ItemType Directory -Force -Path "$dir/resources" | Out-Null
          Copy-Item "src-rs/target/${{ matrix.target }}/release/prizrak-box.exe" "$dir/Prizrak-Box.exe"
          Copy-Item src-go/px.exe                 "$dir/resources/px.exe"
          Copy-Item src-service/px-service.exe    "$dir/resources/px-service.exe"
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "wix.zip"
          Expand-Archive -Path "wix.zip" -DestinationPath "C:\wix" -Force
          "C:\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI (installer/build-msi.js)
        shell: pwsh
        env: { ARCH: '${{ matrix.msiarch }}' }
        run: |
          $env:PATH = "C:\wix;$env:PATH"
          npm install --no-audit --no-fund
          node installer/build-msi.js
          Copy-Item "out/msi/${{ matrix.msiarch }}/windows-${{ matrix.msiarch }}.msi" "windows-${{ matrix.arch }}.msi"
      - name: Stage portable zip
        shell: pwsh
        run: Compress-Archive -Path "out/Prizrak-Box-win32-${{ matrix.msiarch }}/*" -DestinationPath "windows-${{ matrix.arch }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            windows-${{ matrix.arch }}.msi
            windows-${{ matrix.arch }}.zip
      - name: Cancel workflow on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ── Linux — deb + rpm + Arch package via nfpm ──
  build_linux:
    needs: [setup]
    if: github.event_name == 'release' || inputs.build_linux == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout pxd-src
        uses: actions/checkout@v4
        with:
          repository: legiz-ru/pxd-src
          ref: ${{ needs.setup.outputs.pxd_sha }}
          token: ${{ secrets.PRIVATE_SRC_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-go@v6
        with: { go-version: '1.26', check-latest: true, cache: false }
      - name: Private Go module (prizrak-go-kit)
        shell: bash
        env: { PRIVATE_SRC_TOKEN: '${{ secrets.PRIVATE_SRC_TOKEN }}' }
        run: |
          echo "GOPRIVATE=github.com/legiz-ru/prizrak-go-kit" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${PRIVATE_SRC_TOKEN}@github.com/legiz-ru/prizrak-go-kit".insteadOf "https://github.com/legiz-ru/prizrak-go-kit"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-rs -> target', key: 'linux-${{ matrix.arch }}' }
      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV
      - name: Sync VERSION to package.json
        run: node build/sync-version.js
      - name: Install build dependencies (GTK3 + AppIndicator for the tray, fontconfig, xkbcommon)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libfontconfig1-dev libxkbcommon-dev libssl-dev
      - name: Refresh geo/model data
        run: |
          wget -qO src-go/internal/em/Model.bin        --tries=4 --waitretry=5 --header="Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin
          wget -qO src-go/internal/em/geoip.metadb     --tries=4 --waitretry=5 --header="Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
          wget -qO src-go/internal/em/GeoSite.dat      --tries=4 --waitretry=5 --header="Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          wget -qO src-go/internal/em/BundleMRS.7z     --tries=4 --waitretry=5 --header="Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/BundleMRS.7z
          wget -qO src-go/internal/em/GeoLite2-ASN.mmdb --tries=4 --waitretry=5 --header="Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
      - name: Build px + px-service
        env: { GOARCH: '${{ matrix.arch }}' }
        run: |
          (cd src-go && go run github.com/legiz-ru/prizrak-go-kit/prizrakkit/cmd/templates internal/tmpl/builtin)
          (cd src-go && CGO_ENABLED=0 go build -tags=with_gvisor -trimpath -ldflags="-s -w -X github.com/legiz-ru/prizrak-box/api.Version=${{ env.VERSION }}" -o px .)
          (cd src-service && CGO_ENABLED=0 go build -ldflags="-s -w" -o px-service .)
      - name: Build Rust + Slint app
        run: |
          cd src-rs
          cargo build --release --locked
      - name: Package deb + rpm + Arch (nfpm)
        run: |
          set -e
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"
          export PKG_ARCH='${{ matrix.arch }}'
          export PKG_VERSION="$(node -p "require('./package.json').version")"
          CFG=src-rs/packaging/linux/nfpm.yaml
          # deb / rpm: a pre-release as 2.0.0~rc02, which both sort below 2.0.0
          # (2.0.0-rc02 sorts above it, and the stable release then looks like
          # a downgrade to apt / dnf and to the in-app update)
          PKG_VERSION="${PKG_VERSION//-/\~}" "$NFPM" pkg -p deb -f "$CFG" -t "linux-${{ matrix.arch }}.deb"
          PKG_VERSION="${PKG_VERSION//-/\~}" "$NFPM" pkg -p rpm -f "$CFG" -t "linux-${{ matrix.arch }}.rpm"
          PKG_VERSION="${PKG_VERSION//-/_}" "$NFPM" pkg -p archlinux -f "$CFG" -t "linux-${{ matrix.arch }}-aur.tar.zst"
      - name: Validate Release Assets
        run: |
          set -e
          missing=0
          for file in "linux-${{ matrix.arch }}.deb" "linux-${{ matrix.arch }}.rpm" "linux-${{ matrix.arch }}-aur.tar.zst"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty Linux artifact: $file" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { ls -la; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            linux-${{ matrix.arch }}.deb
            linux-${{ matrix.arch }}.rpm
            linux-${{ matrix.arch }}-aur.tar.zst
      - name: Cancel workflow on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ── Release: upload artifacts and update release body ──
  release:
    needs: [setup, build_android, build_windows, build_linux, build_macos]
    # Run only if no build job failed; skipped jobs are tolerated (user may disable some platforms).
    # publish_aur runs after this job (it needs the uploaded assets) and is
    # non-fatal: the AUR is a third-party service whose outages must not block
    # publishing the release artifacts.
    if: |
      always() && !cancelled() && inputs.dry_run != true &&
      needs.setup.result == 'success' &&
      needs.build_android.result != 'failure' &&
      needs.build_windows.result != 'failure' &&
      needs.build_linux.result != 'failure' &&
      needs.build_macos.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update GitHub Release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          NOTES_B64: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes_b64 || '' }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.VERSION;
            const fs = require('fs');
            const path = require('path');
            const dedent = s => s.replace(/\n {12}/g, '\n').replace(/^ {12}/m, '');

            // Run started from workflow_dispatch with release notes: nothing exists
            // yet. The release is built up as a draft (invisible to users), gets its
            // assets and body, and is published only at the very end, so nobody ever
            // sees it without files. The tag is created on publish, at the commit
            // that was built. A draft left by an interrupted run is reused.
            const notesB64 = (process.env.NOTES_B64 || '').replace(/\s+/g, '');
            const deferred = notesB64 !== '';
            const notes = deferred ? Buffer.from(notesB64, 'base64').toString('utf8').trim() : '';

            let release;
            if (deferred) {
              // getReleaseByTag does not see drafts; list them instead.
              const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
              release = releases.find(r => r.tag_name === tag);
              if (release && !release.draft) {
                core.setFailed(`Release '${tag}' is already published; refusing to replace it.`);
                return;
              }
              if (!release) {
                const { data } = await github.rest.repos.createRelease({
                  owner, repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: tag,
                  body: notes,
                  draft: true,
                  prerelease: process.env.PRERELEASE === 'true',
                });
                release = data;
                core.info(`Created draft release ID ${release.id} for tag ${tag}.`);
              } else {
                core.info(`Reusing draft release ID ${release.id} for tag ${tag}.`);
              }
              release.body = notes;
            } else {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                release = data;
                core.info(`Found release ID ${release.id} for tag ${tag}.`);
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Release with tag '${tag}' not found.`);
                  return;
                }
                throw error;
              }
            }

            const downloadLinks = dedent(`<div align=center>

            [![Release Downloads](https://img.shields.io/github/downloads/${owner}/${repo}/${tag}/total?style=flat-square&logo=github)](https://github.com/${owner}/${repo}/releases/${tag})

            </div>

            **Download based on your OS:**

            <div align=left>
            <table>
                <thead align=left>
                    <tr>
                        <th>OS</th>
                        <th>Download</th>
                    </tr>
                </thead>
                <tbody align=left>
                    <tr>
                        <td colspan="2" align="center"><strong>Windows · macOS · Linux</strong></td>
                    </tr>
                    <tr>
                        <td>Windows</td>
                        <td>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/windows-amd64.msi"><img src="https://img.shields.io/badge/Setup-x64-2d7d9a.svg?logo=wattpad"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/windows-arm64.msi"><img src="https://img.shields.io/badge/Setup-arm-2d7d9a.svg?logo=wattpad"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/windows-amd64.zip"><img src="https://img.shields.io/badge/Portable-x64-67b7d1.svg?logo=wattpad"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/windows-arm64.zip"><img src="https://img.shields.io/badge/Portable-arm-67b7d1.svg?logo=wattpad"></a>
                        </td>
                    </tr>
                    <tr>
                        <td>macOS</td>
                        <td>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/macos-arm64.dmg"><img src="https://img.shields.io/badge/DMG-Apple%20Silicon-%23000000.svg?logo=apple"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/macos-amd64.dmg"><img src="https://img.shields.io/badge/DMG-Intel%20X64-%2300A9E0.svg?logo=apple"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/macos-arm64.zip"><img src="https://img.shields.io/badge/ZIP-Apple%20Silicon-%23000000.svg?logo=apple"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/macos-amd64.zip"><img src="https://img.shields.io/badge/ZIP-Intel%20X64-%2300A9E0.svg?logo=apple"></a>
                        </td>
                    </tr>
                    <tr>
                        <td>Linux</td>
                        <td>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-amd64.deb"><img src="https://img.shields.io/badge/DebPackage-x64-FF9966.svg?logo=debian"></a>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-amd64.rpm"><img src="https://img.shields.io/badge/RpmPackage-x64-F1B42F.svg?logo=redhat"></a>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-amd64-aur.tar.zst"><img src="https://img.shields.io/badge/ArchPackage-x64-1793D1.svg?logo=archlinux"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-arm64.deb"><img src="https://img.shields.io/badge/DebPackage-arm64-FF9966.svg?logo=debian"></a>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-arm64.rpm"><img src="https://img.shields.io/badge/RpmPackage-arm64-F1B42F.svg?logo=redhat"></a>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/linux-arm64-aur.tar.zst"><img src="https://img.shields.io/badge/ArchPackage-arm64-1793D1.svg?logo=archlinux"></a><br>
                            <a href="https://aur.archlinux.org/packages/prizrak-box-bin"><img src="https://img.shields.io/aur/version/prizrak-box-bin?logo=archlinux"></a>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center"><strong>Android</strong></td>
                    </tr>
                    <tr>
                        <td>Android</td>
                        <td>
                            <a href="https://legiz-ru.github.io/Orion/redirect-page/?redirect_to=obtainium://app/%7B%22id%22:%22ru.legiz.prizrakbox.meta%22,%22url%22:%22https://github.com/legiz-ru/Prizrak-Box/releases%22,%22author%22:%22legiz-ru%22,%22name%22:%22Prizrak-Box%22,%22preferredApkIndex%22:0,%22additionalSettings%22:%22%7B%5C%22includePrereleases%5C%22:true,%5C%22fallbackToOlderReleases%5C%22:true,%5C%22autoApkFilterByArch%5C%22:true,%5C%22trackOnly%5C%22:false,%5C%22versionDetection%5C%22:true%7D%22%7D"><img src="https://img.shields.io/badge/Get%20it%20on-Obtainium-EF7100.svg?logo=android&logoColor=white" alt="Get it on Obtainium"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/prizrak-box-android-universal.apk"><img src="https://img.shields.io/badge/APK-universal-96ed89.svg?logo=android"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/prizrak-box-android-arm64-v8a.apk"><img src="https://img.shields.io/badge/APK-ARMv8-168039.svg?logo=android"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/prizrak-box-android-armeabi-v7a.apk"><img src="https://img.shields.io/badge/APK-ARMv7-45bf55.svg?logo=android"></a><br>
                            <a href="https://github.com/${owner}/${repo}/releases/download/${tag}/prizrak-box-android-x86_64.apk"><img src="https://img.shields.io/badge/APK-x64-96ed89.svg?logo=android"></a>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>`);

            // The download table is appended to the notes in both flows. A body that
            // already exists may carry the table from an earlier run, which is cut
            // off first; notes passed as release_notes_b64 are always fresh, so they
            // are kept verbatim (their own <div align=center> blocks included).
            const baseBody = deferred
              ? notes
              : (release.body ? release.body.replace(/\n*<div align=center>[\s\S]*<\/div>\s*$/, '') : '');
            const newBody = (baseBody ? baseBody + '\n\n' : '') + downloadLinks;

            // A draft has no tag yet, and an update that leaves tag_name out makes
            // GitHub rename it to 'untagged-…': on publish the release then gets
            // no tag and its download links are dead. Every update of the draft
            // therefore repeats the tag and the commit that was built.
            const draftTarget = deferred ? { tag_name: tag, target_commitish: context.sha } : {};

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              ...draftTarget,
              body: newBody,
            });
            core.info(`Successfully updated release body.`);

            const uploadedAssets = new Set();
            const artifactsDir = 'artifacts';

            if (!fs.existsSync(artifactsDir)) {
              if (deferred) {
                core.setFailed('No artifacts were built; leaving the release as an unpublished draft.');
                return;
              }
              core.info('No artifacts directory found, skipping upload.');
              return;
            }

            // Fetch existing assets so re-runs can delete and replace them
            const { data: existingAssets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100,
            });
            const existingAssetMap = new Map(existingAssets.map(a => [a.name, a.id]));

            const platformDirs = fs.readdirSync(artifactsDir);
            for (const platformDir of platformDirs) {
              const files = fs.readdirSync(path.join(artifactsDir, platformDir));
              for (const fileName of files) {
                if (uploadedAssets.has(fileName)) {
                  core.info(`Skipping duplicate asset: ${fileName}`);
                  continue;
                }
                // Delete stale asset from a previous run before re-uploading
                if (existingAssetMap.has(fileName)) {
                  core.info(`Replacing existing asset: ${fileName}`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner, repo, asset_id: existingAssetMap.get(fileName),
                  });
                }
                const filePath = path.join(artifactsDir, platformDir, fileName);
                core.info(`Uploading asset: ${fileName}`);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.id,
                  name: fileName,
                  data: fs.readFileSync(filePath),
                });
                uploadedAssets.add(fileName);
              }
            }
            core.info('All assets uploaded successfully.');

            if (deferred) {
              const { data: published } = await github.rest.repos.updateRelease({
                owner, repo,
                release_id: release.id,
                ...draftTarget,
                draft: false,
              });
              if (published.tag_name !== tag || published.draft) {
                core.setFailed(`Release ${published.id} was published as '${published.tag_name}' (draft: ${published.draft}), not as tag '${tag}'. Fix it with: gh api -X PATCH repos/${owner}/${repo}/releases/${published.id} -f tag_name=${tag} -f target_commitish=${context.sha}`);
                return;
              }
              try {
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                if (ref.object.type === 'commit' && ref.object.sha !== context.sha) {
                  core.warning(`Tag ${tag} already existed and points to ${ref.object.sha}, not to the built commit ${context.sha}.`);
                }
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`Release ${tag} is published, but the tag '${tag}' was not created; its download links do not work.`);
                  return;
                }
                throw error;
              }
              core.info(`Published release ${tag} on tag ${tag}.`);
            }

  # ── Update feed (doc/auto-update-plan.md) ──
  # stable.json for the in-app updater, read through jsDelivr from the
  # update-feed branch. Only a stable release (vX.Y.Z, not a pre-release or a
  # draft) changes it, so rc / beta builds are never offered.
  update_feed:
    needs: [setup, release]
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write stable.json to the update-feed branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$TAG is not a stable version: the update feed stays as it is"
            exit 0
          fi
          REL=$(gh api "repos/$REPO/releases/tags/$TAG")
          if [ "$(printf '%s' "$REL" | jq -r '.prerelease or .draft')" = "true" ]; then
            echo "$TAG is a pre-release or a draft: the update feed stays as it is"
            exit 0
          fi
          NAMES='["windows-amd64.msi","windows-arm64.msi","windows-amd64.zip","windows-arm64.zip","macos-amd64.dmg","macos-arm64.dmg","macos-amd64.zip","macos-arm64.zip","linux-amd64.deb","linux-arm64.deb","linux-amd64.rpm","linux-arm64.rpm","linux-amd64-aur.tar.zst","linux-arm64-aur.tar.zst","prizrak-box-android-arm64-v8a.apk","prizrak-box-android-armeabi-v7a.apk","prizrak-box-android-x86.apk","prizrak-box-android-x86_64.apk","prizrak-box-android-universal.apk"]'
          printf '%s' "$REL" | jq --argjson names "$NAMES" '{
            version: (.tag_name | ltrimstr("v")),
            tag: .tag_name,
            url: .html_url,
            published_at: .published_at,
            assets: ([.assets[] | select(.name as $n | $names | index($n)) | {key: .name, value: {size: .size, sha256: ((.digest // "") | ltrimstr("sha256:"))}}] | from_entries)
          }' > stable.json
          cat stable.json
          MISSING=$(jq -r --argjson names "$NAMES" '($names - (.assets | keys)) | join(" ")' stable.json)
          NODIGEST=$(jq -r '[.assets | to_entries[] | select((.value.sha256 | length) != 64) | .key] | join(" ")' stable.json)
          if [ -n "$MISSING" ] || [ -n "$NODIGEST" ]; then
            echo "::warning::update feed: missing files [$MISSING], files without a SHA-256 [$NODIGEST] — these installs fall back to the GitHub API"
          fi
          mkdir feed && cd feed
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan update-feed
          cp ../stable.json .
          git add stable.json
          git commit -qm "update feed: $TAG"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" update-feed
      - name: Purge the jsDelivr cache
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@update-feed/stable.json" || echo "::warning::jsDelivr purge failed; stable.json there may stay old for up to 12 h (the app also asks the GitHub API)"
